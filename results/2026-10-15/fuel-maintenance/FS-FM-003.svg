<rect x="45" y="246" width="205" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="55" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">2 - Maintain</text>
