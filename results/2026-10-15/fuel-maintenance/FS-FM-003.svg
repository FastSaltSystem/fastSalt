<text x="600" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Available</text>
<rect x="950" y="246" width="689" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="960" y="270" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Maintain position; internal port isolation details TBD</text>
<rect x="45" y="284" width="205" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="55" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">3 - Reduce pressure</text>
<rect x="250" y="284" width="340" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="260" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Available</text>
<rect x="590" y="284" width="360" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="600" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Available</text>
<rect x="950" y="284" width="689" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="960" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Common gas port C to surge header H-S</text>
<rect x="45" y="322" width="205" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="55" y="346" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">4 - Vent to off-gas</text>
<rect x="250" y="322" width="340" height="38" stroke="#15232b" fill="white" stroke-width="1.3"/>
<text x="260" y="346" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#15232b">Available</text>
