<text x="42" y="83" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#15232b">VALVE POSITIONS, OPERATING STATES AND TAG SCHEDULE</text>
<text x="42" y="108" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#4b5b64">Owner-defined states; compressor pressure-difference start/stop control on sheet 2. Setpoints and fail positions TBD.</text>
