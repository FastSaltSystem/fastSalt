<text x="58" y="510" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">EXPANSION / CONTRACTION AS NEEDED</text>
<text x="58" y="535" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Transfer expanded salt to TK-401; return salt as the circuit contracts.</text>
<text x="58" y="555" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Most expansion is assigned to storage, not the nominal SG gas vessels.</text>
<text x="58" y="575" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Between transfers: stop P-401; close V-401, V-402 and V-402G.</text>
<text x="58" y="595" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Transfer triggers, level limits and usable storage volume remain TBD.</text>
<text x="58" y="658" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">PRESSURE AND GAS PATHS</text>
<text x="58" y="683" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Normal circulation: SG gas valves open to the common regulated header.</text>
<text x="58" y="703" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Tank emptying / sweep: isolate SG gas branches; open the TK gas branch.</text>
<text x="58" y="723" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Preparation &gt; G-400 &gt; H-401 &gt; G-402 &gt; TK-401 &gt; L-404 &gt; J-401 &gt; L-403 &gt; preparation.</text>
<text x="58" y="743" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">This sweep covers the tank / return line; reactor and SG draining use P-401.</text>
