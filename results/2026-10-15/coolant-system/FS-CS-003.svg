<text x="60" y="771" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Relief return to TK-401 is a proposal; existing closed transfer valves prevent crediting that path for relief.</text>
