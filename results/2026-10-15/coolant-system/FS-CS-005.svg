<text x="400" y="485" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">L-103R</text>
<text x="630" y="520" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Salt / steam / gas</text>
<polyline points="290,550 290,535 385,535" fill="none" stroke="#50745e" stroke-width="1.5"/>
<text x="390" y="538" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#173345" text-anchor="start">AC / normal gas: sheet 3</text>
<text x="40" y="655" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#173345" text-anchor="start">REQUIREMENT: preserve reactor coolant inventory; prevent continued gravity drainage and siphoning after relief.</text>
<text x="40" y="678" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Discs normally intact; remain open after actuation. No intervening isolation valve is included in this concept.</text>
<text x="40" y="701" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Independent of AC-101/102/103, G-101/102/103 and H-401. Closing a normal gas valve does not isolate these paths.</text>
<text x="40" y="724" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">High takeoffs do not prove retention during pressure-driven discharge; expelled salt and two-phase flow remain to assess.</text>
<text x="40" y="747" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">TBD: elevations, burst pressure at disc temperature, area/capacity, backpressure, freeze protection and post-event cooling.</text>
<text x="40" y="770" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Symbol: curved diaphragm between holder faces = rupture disc. Functional schematic; no physical pipe slopes implied.</text>
<polyline points="35,804 1165,804" fill="none" stroke="#173345" stroke-width="1"/>
<text x="35" y="824" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#173345" text-anchor="start">FS-CS-005 | Rev B-working | 14 October 2026 | Preliminary - for discussion</text>
<text x="1165" y="824" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="end">Sheet 5 / 6 | Functional schematic; not to scale</text>
</svg>