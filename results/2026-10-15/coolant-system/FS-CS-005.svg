<text x="1030" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">Receiver(s), capacity,</text>
<text x="1030" y="320" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">steam vent and routing TBD.</text>
<text x="1030" y="380" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">Three separate terminations.</text>
<text x="1030" y="400" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">No common relief header</text>
<text x="1030" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">or receiver count selected.</text>
<text x="1030" y="540" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="middle">Not normal gas / off-gas.</text>
