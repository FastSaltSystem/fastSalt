<text x="35" y="72" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#173345" text-anchor="start">Dedicated high-level SG relief</text>
<text x="35" y="99" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#546772" text-anchor="start">D-062: accepted connection concept; rupture-disc sizing and discharge receiving arrangements remain unresolved.</text>
