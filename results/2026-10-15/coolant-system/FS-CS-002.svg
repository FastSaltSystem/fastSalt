<text x="35" y="315" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">50 mm radial insulation: provisional layout allowance.</text>
<text x="35" y="336" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Pump duty, construction and thermal design remain open.</text>
<rect x="35" y="533" width="550" height="116" fill="#edf3f6" stroke="#edf3f6" stroke-width="1.3"/>
<text x="47" y="555" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">DRAWING CONVENTIONS</text>
<text x="47" y="577" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Solid pipes: established process connections; arrows show intended flow.</text>
<text x="47" y="594" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Red / blue = hot / return salt; dark = service salt; green = coolant gas.</text>
<text x="47" y="611" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Amber valves and instrument bubbles: proposals for review.</text>
<text x="47" y="628" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Dashed lines: measurement association, not impulse or signal lines.</text>
<rect x="610" y="533" width="555" height="116" fill="#edf3f6" stroke="#edf3f6" stroke-width="1.3"/>
<text x="622" y="555" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">TAG KEY / PROPOSAL LIMITS</text>
<text x="622" y="577" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">TT temperature; PT pressure; FT flow; LT level (measurement intent).</text>
<text x="622" y="594" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">V = isolation valve; type, actuation and fail position unselected.</text>
<text x="622" y="611" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">R reactor; SG steam generator; P pump; TK storage; L process line.</text>
<text x="622" y="628" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Pressure-control intent: sheet 3; settings and protection unresolved.</text>
<rect x="35" y="666" width="550" height="116" fill="#edf3f6" stroke="#edf3f6" stroke-width="1.3"/>
<text x="47" y="688" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">OPEN: OPERATING AND MAINTENANCE STATES</text>
<text x="47" y="710" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Reactor / SG drainage via P-401; tank / L-403 blowdown via G-402.</text>
<text x="47" y="727" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Establish inventory, tank freeboard, gas space and expansion provision.</text>
<text x="47" y="744" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Coolant-gas connections: sheet 3; agreed states: sheet 4.</text>
<text x="47" y="761" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Check pump suction conditions and shared-plenum flow distribution.</text>
<rect x="610" y="666" width="555" height="116" fill="#edf3f6" stroke="#edf3f6" stroke-width="1.3"/>
<text x="622" y="688" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#173345" text-anchor="start">OPEN: PRESSURE BOUNDARIES AND PROTECTION</text>
<text x="622" y="710" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Establish pressure profile; 1 MPa(g) is only a wall-screening case.</text>
<text x="622" y="727" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Steam leaks to SG air side by design; resolve air-side response.</text>
<text x="622" y="744" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Define vent / relief destinations and trapped-salt thermal protection.</text>
<text x="622" y="761" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#173345" text-anchor="start">Review proposed isolation, measurement technology and remote access.</text>
