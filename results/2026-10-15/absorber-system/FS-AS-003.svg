<text x="530" y="610" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Lower-cylinder fit is tight for secondary; upper box space</text>
<text x="530" y="630" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">may be needed. Heads, walls and equipment are additional.</text>
<text x="45" y="686" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Gas-space estimates use equal-temperature isothermal balances, source-derived density, zero heel and prefilled salt lines.</text>
<text x="45" y="706" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Both cases exclude the bottom reflector. The second includes provisional upper gas space; neither adds salt below the core.</text>
<text x="45" y="726" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">No updated injection time: viscosity, final hydraulic route, gas restrictions and required shutdown time remain unresolved.</text>
<text x="45" y="746" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Source: AbsorberSaltInjectionTime.docx, pp. 1-6. See the editable Hurmet worksheet for equations, assumptions and checks.</text>
<text x="45" y="766" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">The existing 3D salt tubes stop at the absorber tank top. External connections at the active-core bottom are shown on sheet 1, pending 3D routing.</text>
