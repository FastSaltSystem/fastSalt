<text x="45" y="729" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Arrows on salt line show injection; recovery reverses flow. Gas lines from reservoir/chamber: 25 mm OD visual allowance.</text>
<text x="45" y="746" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Amber instruments are proposals. Heater controls, relief paths and compressor nonreturn details remain open.</text>
<text x="45" y="763" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">Charge and discharge service valves are closed in normal duty. Separate return goes to gas treatment before any release.</text>
<text x="45" y="780" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#173345" text-anchor="start">This sheet defines functions and endpoints. It does not assign shutdown logic, pressure ratings, valve sizing or insertion time.</text>
