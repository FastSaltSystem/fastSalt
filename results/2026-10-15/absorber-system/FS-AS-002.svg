<text x="40" y="620" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Each circuit has one absorber chamber, one salt reservoir, two gas volumes, one recovery compressor and a routing function.</text>
<text x="40" y="644" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Six stationary absorber tanks each contain two chambers. Each chamber has its own reservoir and absorber module.</text>
<text x="40" y="668" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Suggested monitoring: pressure in each gas vessel; reservoir temperature and inventory; chamber fill indication (method unresolved).</text>
<text x="40" y="692" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Gas recovery is from surge to pressure vessel. Compressor duty, reset sequence and isolation/check arrangements remain unselected.</text>
<text x="40" y="716" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Normal duty: isolate both service lines per module. Charging and discharge functions and unresolved controls are on sheet 4.</text>
<text x="40" y="740" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#173345" text-anchor="start">Machine-readable equipment, line and instrument records expand all twelve circuits; a register accompanies this drawing.</text>
