[owner_states.remove_fuel]
label = "Remove fuel"
source = "Owner description, 15 October 2026"
status = "Owner-supplied draft description"
core_pressure_valves = "Add pressure"
maintenance_pressure_valves = "Reduce pressure"
empty_indication = "Presence of gas in a bottom line"
on_empty = "Return the corresponding core-pressure valve and maintenance-pressure valve to Maintain."
completion = "All valves are in Maintain when all tanks are empty."
verbatim = "In this case all the core pressure valves are put into \"Add pressure\" position and all of the maintenance valves are put into the \"Reduce pressure\" position until the fuel is emptied. The presence of gas in a bottom line indicates \"empty\" and those two valves are put back in \"Maintain\". All valve are in maintain when all tanks are empty."

[owner_states.fill_fuel]
label = "Fill fuel"
source = "Owner description, 15 October 2026"
status = "Owner-supplied draft description"
core_pressure_valves = "Reduce pressure"
maintenance_pressure_valves = "Add pressure"
empty_indication = "Gas appears in the bottom line from a maintenance tank."
indication_meaning = "That maintenance tank is empty."
on_empty = "Return the corresponding core-pressure valve and maintenance-pressure valve to Maintain."
completion = "All valves are in Maintain when filling is complete."
verbatim = "Let's add the fill fuel state, with the maintenance valves in Add pressure and the core valves in Reduce pressure."
completion_verbatim = "When gas appears in the bottom line from a maintenance tank, that tank is empty and the corresponding two valves should go back to Maintain. All valves should be in Maintain when filling is complete."

