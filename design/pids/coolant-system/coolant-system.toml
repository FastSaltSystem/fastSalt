# P&ID view: shared main-circulation data plus local storage, instruments and valves.
# TOML has no null. List omitted, unresolved values in unresolved_fields.
# The Python loader restores those fields as None; never use zero for unknown.

schema_version = 1

[shared_engineering]
model = "../../engineering/coolant-system.toml"

