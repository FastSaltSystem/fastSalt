# Shared main circulation plus local P&ID equipment, gas and operating states.
# Unknown quantities are listed in unresolved_fields; they are not zero.
schema_version = 1

[shared_engineering]
model = "../../engineering/coolant-system.toml"

[document]
id = "FS-CS"
title = "WISTR coolant system"
revision = "B-working"
date = "14 October 2026"
status = "Preliminary - for discussion"

[equipment]

[equipment.R-101]
shared = true

[equipment.SG-101]
shared = true

[equipment.P-101]
